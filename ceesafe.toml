[package]
name = "usb"
version = "0.1.0"
kind = "library"
ceesafec = ">=0.79.0"
# Endpoint rings, buffers and device handles hold native pointers shared with the event-loop thread; they are
# declared @threadSafe (ADR 0025). Every such type says why in its doc comment.
trusted = true
include-dirs = ["include"]
c = ["src/platform/native.c"]
tests = ["tests"]

[target.macos]
frameworks = ["IOKit", "CoreFoundation"]

[target.windows]
links = ["cfgmgr32", "winusb", "advapi32"]

[dependencies]
